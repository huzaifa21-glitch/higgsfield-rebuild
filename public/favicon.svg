<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Morph</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a76"/>
      <stop offset="1" stop-color="#ff5f45"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0c0c0e"/>
  <!-- A circle morphing into a square: the before/after idea in one mark -->
  <circle cx="25" cy="32" r="13" fill="#ededf0" opacity="0.92"/>
  <rect x="27" y="19" width="26" height="26" rx="7" fill="url(#g)" opacity="0.95"/>
</svg>
